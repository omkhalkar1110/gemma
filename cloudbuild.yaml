# ==============================================================================
# GOOGLE CLOUD BUILD CI/CD PIPELINE FOR CLOUD RUN DEPLOYMENT
# ==============================================================================
steps:
  # 1. Build Container Image using Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aegis-gemma-gateway:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aegis-gemma-gateway:latest'
      - '.'

  # 2. Push Container Image to Google Container Registry (GCR) / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aegis-gemma-gateway:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aegis-gemma-gateway:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aegis-gemma-gateway'
      - '--image=gcr.io/$PROJECT_ID/aegis-gemma-gateway:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--concurrency=80'
      - '--set-env-vars=NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/aegis-gemma-gateway:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/aegis-gemma-gateway:latest'
